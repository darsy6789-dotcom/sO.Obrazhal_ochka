<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Кто быстрее?</title>

  <style>

    /* =========================================================
       ОСНОВНЫЕ ЦВЕТА
    ========================================================= */

    :root {
      --bg: #f4f1ec;
      --surface: #ffffff;
      --surface-2: #e9e5df;
      --text: #1f1f1f;
      --muted: #77736d;
      --border: #252525;
      --shadow: rgba(0, 0, 0, 0.12);
    }

    body.dark {
      --bg: #151515;
      --surface: #222222;
      --surface-2: #303030;
      --text: #f3f3f3;
      --muted: #aaaaaa;
      --border: #eeeeee;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition:
        background 0.25s,
        color 0.25s;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       СТАРТОВЫЙ ЭКРАН
    ========================================================= */

    .start-screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .start-card {
      width: min(540px, 100%);
      padding: 38px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 18px 50px var(--shadow);
    }

    .start-card h1 {
      text-align: center;
      margin: 0;
      font-size: 44px;
    }

    .start-description {
      text-align: center;
      color: var(--muted);
      margin: 10px 0 30px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid var(--surface-2);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--border);
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 22px;
      background: var(--text);
      color: var(--bg);
      font-weight: bold;
      font-size: 18px;
    }


    /* =========================================================
       ИГРА
    ========================================================= */

    .game {
      width: min(1080px, 94%);
      margin: 0 auto;
      padding: 22px 0 45px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .game-title {
      margin: 0;
      font-size: 28px;
    }

    .top-buttons {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-button {
      border: 1px solid var(--surface-2);
      border-radius: 14px;
      padding: 10px 13px;
      background: var(--surface);
      color: var(--text);
    }


    /* =========================================================
       ПРОГРЕСС
    ========================================================= */

    .progress-area {
      background: var(--surface);
      border-radius: 20px;
      padding: 15px 18px;
      margin-bottom: 17px;
      box-shadow: 0 5px 18px var(--shadow);
    }

    .round-text {
      text-align: center;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 11px;
    }

    .letters-progress {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .letter-chip {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--surface-2);
      font-weight: bold;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .letter-chip.done {
      opacity: 0.32;
      text-decoration: line-through;
    }

    .letter-chip.current {
      background: var(--surface);
      border-color: var(--border);
      transform: scale(1.14);
    }


    /* =========================================================
       ВОПРОС И БУКВА
    ========================================================= */

    .main-cards {
      display: grid;
      grid-template-columns: 2fr 0.72fr;
      gap: 16px;
    }

    .question-card,
    .letter-card {
      min-height: 240px;
      padding: 25px;
      border-radius: 25px;
      border: 3px solid var(--border);
      background: var(--surface);
      box-shadow: 0 8px 25px var(--shadow);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-label {
      margin-bottom: 19px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
    }

    #question {
      text-align: center;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1.18;
      font-weight: 800;
    }

    #letter {
      font-size: clamp(90px, 13vw, 145px);
      line-height: 1;
      font-weight: 900;
    }


    /* =========================================================
       ТАЙМЕР
    ========================================================= */

    .timer-area {
      padding: 20px 0 15px;
      text-align: center;
    }

    #timer {
      font-size: 58px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    #statusMessage {
      min-height: 28px;
      margin-top: 3px;
      font-size: 18px;
      font-weight: bold;
    }


    /* =========================================================
       ИГРОКИ
    ========================================================= */

    .players {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .player-card {
      position: relative;
      min-height: 165px;
      padding: 20px;
      border: none;
      border-radius: 25px;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      box-shadow: 0 8px 24px var(--shadow);

      transition:
        transform 0.12s,
        filter 0.2s;

      user-select: none;
    }

    .player-card:not(:disabled):hover {
      transform: translateY(-3px);
      filter: brightness(1.03);
    }

    .player-card:not(:disabled):active {
      transform: scale(0.98);
    }

    .player-card:disabled {
      cursor: default;
    }

    .player-name {
      font-size: 22px;
      font-weight: bold;
    }

    .player-score {
      margin: 8px 0;
      font-size: 54px;
      line-height: 1;
      font-weight: 900;
    }

    .point-hint {
      font-size: 13px;
      opacity: 0.72;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .plus-one {
      position: absolute;
      top: 18px;
      right: 23px;
      font-size: 30px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
    }

    .plus-one.show {
      animation: plusAnimation 0.6s ease;
    }

    @keyframes plusAnimation {

      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.6);
      }

      35% {
        opacity: 1;
        transform: translateY(-2px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateY(-28px) scale(1);
      }

    }


    /* =========================================================
       МИНИ-ПРАЗДНИК КАЖДЫЕ 5 ОЧКОВ
    ========================================================= */

    .mini-celebration {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 20;
    }

    .mini-particle {
      position: absolute;
      left: 50%;
      top: 55%;
      font-size: 30px;
      opacity: 0;
      pointer-events: none;
      animation: miniBurst 1.1s ease-out forwards;
    }

    @keyframes miniBurst {

      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(0.3);
      }

      20% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(var(--r))
          scale(1.25);
      }

    }


    /* =========================================================
       КНОПКИ РАУНДА
    ========================================================= */

    .round-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .secondary-button {
      border: none;
      border-radius: 15px;
      padding: 13px 20px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: bold;
    }

    .next-button {
      background: var(--text);
      color: var(--bg);
    }


    /* =========================================================
       НАСТРОЙКИ
    ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.58);
    }

    .settings-modal {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 27px;

      background: var(--surface);
      color: var(--text);
      border-radius: 28px;

      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.38);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 19px;
    }

    .settings-header h2 {
      margin: 0;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      font-size: 23px;
    }

    .setting-section {
      padding: 19px 0;
      border-top: 1px solid var(--surface-2);
    }

    .setting-section:first-of-type {
      border-top: none;
    }

    .setting-title {
      margin-bottom: 12px;
      font-weight: bold;
    }

    .settings-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--surface-2);
      background: var(--bg);
      color: var(--text);
    }

    .theme-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .theme-button {
      padding: 12px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--surface-2);
      color: var(--text);
    }

    .theme-button.selected {
      border-color: var(--border);
    }


    /* =========================================================
       ЦВЕТА ИГРОКОВ
    ========================================================= */

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .color-option {
      position: relative;
      height: 46px;
      border-radius: 13px;
      border: 3px solid transparent;
    }

    .color-option.selected {
      border-color: var(--text);
    }

    .color-option.selected::after {
      content: "✓";
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 21px;
      font-weight: 900;
      color: inherit;
    }


    /* =========================================================
       ПЕРЕКЛЮЧАТЕЛЬ
    ========================================================= */

    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .switch-description {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .switch {
      position: relative;
      width: 55px;
      height: 31px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 31px;
      background: var(--surface-2);
      transition: 0.25s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 23px;
      height: 23px;
      top: 4px;
      left: 4px;
      border-radius: 50%;
      background: var(--text);
      transition: 0.25s;
    }

    .switch input:checked + .slider {
      background: #74d07b;
    }

    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }


    /* =========================================================
       ФИНАЛ
    ========================================================= */

    .winner-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 22px;
      overflow: hidden;

      background: var(--bg);
    }

    .winner-card {
      position: relative;
      z-index: 5;

      width: min(620px, 100%);
      padding: 46px 32px;

      text-align: center;

      background: var(--surface);
      border-radius: 32px;
      box-shadow: 0 22px 70px var(--shadow);
    }

    .winner-card h2 {
      margin: 0 0 15px;
      font-size: 43px;
    }

    #winnerText {
      font-size: 26px;
      font-weight: bold;
    }

    #finalScore {
      margin: 22px 0 30px;
      font-size: 58px;
      font-weight: 900;
    }


    /* =========================================================
       БОЛЬШИЕ ПОБЕДНЫЕ ЭФФЕКТЫ
    ========================================================= */

    #victoryEffects {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-effect {
      position: absolute;
      top: -70px;
      animation: fallDown linear forwards;
      user-select: none;
    }

    @keyframes fallDown {

      from {
        transform:
          translateY(-100px)
          rotate(0deg);
      }

      to {
        transform:
          translateY(calc(100vh + 150px))
          rotate(540deg);
      }

    }

    .heart-effect {
      position: absolute;
      bottom: -60px;
      animation: heartUp linear forwards;
      user-select: none;
    }

    @keyframes heartUp {

      from {
        transform:
          translateY(0)
          scale(0.7)
          rotate(-10deg);
        opacity: 1;
      }

      to {
        transform:
          translateY(-120vh)
          scale(1.45)
          rotate(25deg);
        opacity: 0;
      }

    }

    .balloon-effect {
      position: absolute;
      bottom: -100px;
      animation: balloonUp linear forwards;
      user-select: none;
    }

    @keyframes balloonUp {

      from {
        transform: translateY(0);
      }

      to {
        transform:
          translateY(-125vh)
          translateX(var(--drift));
      }

    }

    .plane-effect {
      position: absolute;
      left: -250px;
      font-size: 46px;

      animation: planeFly linear forwards;

      white-space: nowrap;
      user-select: none;
    }

    @keyframes planeFly {

      from {
        transform: translateX(0);
      }

      to {
        transform:
          translateX(calc(100vw + 500px));
      }

    }

    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
    }

    .firework-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;

      animation: fireworkBurst 1.3s ease-out forwards;
    }

    @keyframes fireworkBurst {

      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          scale(0.2);
      }

    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 11px;
      height: 18px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {

      to {
        transform:
          translateY(115vh)
          rotate(720deg);
      }

    }


    /* =========================================================
       МОБИЛЬНАЯ ВЕРСИЯ
    ========================================================= */

    @media (max-width: 700px) {

      .game {
        width: 94%;
      }

      .topbar {
        align-items: flex-start;
      }

      .game-title {
        font-size: 22px;
      }

      .main-cards {
        grid-template-columns: 1fr;
      }

      .question-card {
        min-height: 175px;
      }

      .letter-card {
        min-height: 145px;
      }

      .players {
        grid-template-columns: 1fr;
      }

      #timer {
        font-size: 48px;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       СТАРТОВЫЙ ЭКРАН
  ======================================================== -->

  <section
    id="startScreen"
    class="start-screen"
  >

    <div class="start-card">

      <h1>Кто быстрее?</h1>

      <div class="start-description">
        Получи букву и придумай подходящее слово быстрее соперника.
      </div>


      <div class="field">

        <label for="startName1">
          Имя первого игрока
        </label>

        <input
          id="startName1"
          type="text"
          maxlength="20"
          placeholder="Игрок 1"
        >

      </div>


      <div class="field">

        <label for="startName2">
          Имя второго игрока
        </label>

        <input
          id="startName2"
          type="text"
          maxlength="20"
          placeholder="Игрок 2"
        >

      </div>


      <div class="field">

        <label for="roundCount">
          Сколько букв будет в партии?
        </label>

        <select id="roundCount">

          <option value="3">3 буквы</option>
          <option value="4">4 буквы</option>
          <option value="5">5 букв</option>
          <option value="6">6 букв</option>
          <option value="7">7 букв</option>
          <option value="8">8 букв</option>
          <option value="9">9 букв</option>
          <option value="10" selected>10 букв</option>

        </select>

      </div>


      <button
        class="primary-button"
        onclick="startGame()"
      >
        Начать игру
      </button>

    </div>

  </section>


  <!-- =======================================================
       ИГРА
  ======================================================== -->

  <main
    id="gameScreen"
    class="game hidden"
  >

    <header class="topbar">

      <h1 class="game-title">
        Кто быстрее?
      </h1>


      <div class="top-buttons">

        <button
          class="small-button"
          onclick="restartGame()"
        >
          ↻ Новая партия
        </button>

        <button
          class="small-button"
          onclick="openSettings()"
        >
          ⚙ Настройки
        </button>

      </div>

    </header>


    <!-- ПРОГРЕСС -->

    <section class="progress-area">

      <div
        id="roundText"
        class="round-text"
      ></div>

      <div
        id="lettersProgress"
        class="letters-progress"
      ></div>

    </section>


    <!-- ВОПРОС -->

    <section class="main-cards">

      <div class="question-card">

        <div class="card-label">
          Вопрос
        </div>

        <div id="question">
          —
        </div>

      </div>


      <div class="letter-card">

        <div class="card-label">
          Буква
        </div>

        <div id="letter">
          ?
        </div>

      </div>

    </section>


    <!-- ТАЙМЕР -->

    <section class="timer-area">

      <div id="timer">
        00:30
      </div>

      <div id="statusMessage"></div>

    </section>


    <!-- ИГРОКИ -->

    <section class="players">


      <button
        id="playerCard1"
        class="player-card"
        onclick="givePoint(1)"
      >

        <div
          id="playerName1"
          class="player-name"
        >
          Игрок 1
        </div>

        <div
          id="score1"
          class="player-score"
        >
          0
        </div>

        <div class="point-hint">
          Нажми, если ответил первым
        </div>

        <div
          id="plus1"
          class="plus-one"
        >
          +1
        </div>

        <div
          id="miniCelebration1"
          class="mini-celebration"
        ></div>

      </button>


      <button
        id="playerCard2"
        class="player-card"
        onclick="givePoint(2)"
      >

        <div
          id="playerName2"
          class="player-name"
        >
          Игрок 2
        </div>

        <div
          id="score2"
          class="player-score"
        >
          0
        </div>

        <div class="point-hint">
          Нажми, если ответил первым
        </div>

        <div
          id="plus2"
          class="plus-one"
        >
          +1
        </div>

        <div
          id="miniCelebration2"
          class="mini-celebration"
        ></div>

      </button>


    </section>


    <!-- УПРАВЛЕНИЕ -->

    <section class="round-controls">

      <button
        id="skipButton"
        class="secondary-button"
        onclick="skipLetter()"
      >
        Не знаем — отложить букву
      </button>


      <button
        id="nextButton"
        class="secondary-button next-button hidden"
        onclick="nextRoundAfterPoint()"
      >
        Следующий раунд →
      </button>

    </section>

  </main>


  <!-- =======================================================
       НАСТРОЙКИ
  ======================================================== -->

  <div
    id="settingsBackdrop"
    class="modal-backdrop hidden"
    onclick="backdropClick(event)"
  >

    <div class="settings-modal">


      <div class="settings-header">

        <h2>
          ⚙ Настройки
        </h2>

        <button
          class="close-button"
          onclick="closeSettings()"
        >
          ×
        </button>

      </div>


      <!-- ИМЕНА -->

      <div class="setting-section">

        <div class="setting-title">
          Имена игроков
        </div>


        <div class="field">

          <label>
            Игрок 1
          </label>

          <input
            id="settingsName1"
            class="settings-input"
            maxlength="20"
            oninput="updateNamesFromSettings()"
          >

        </div>


        <div class="field">

          <label>
            Игрок 2
          </label>

          <input
            id="settingsName2"
            class="settings-input"
            maxlength="20"
            oninput="updateNamesFromSettings()"
          >

        </div>

      </div>


      <!-- ТЕМА -->

      <div class="setting-section">

        <div class="setting-title">
          Тема
        </div>


        <div class="theme-options">

          <button
            id="lightThemeButton"
            class="theme-button"
            onclick="setTheme('light')"
          >
            ☀ Светлая
          </button>


          <button
            id="darkThemeButton"
            class="theme-button"
            onclick="setTheme('dark')"
          >
            ☾ Тёмная
          </button>

        </div>

      </div>


      <!-- ЦВЕТ ИГРОКА 1 -->

      <div class="setting-section">

        <div class="setting-title">
          Цвет карточки игрока 1
        </div>

        <div
          id="colorsPlayer1"
          class="color-grid"
        ></div>

      </div>


      <!-- ЦВЕТ ИГРОКА 2 -->

      <div class="setting-section">

        <div class="setting-title">
          Цвет карточки игрока 2
        </div>

        <div
          id="colorsPlayer2"
          class="color-grid"
        ></div>

      </div>


      <!-- АВТОПЕРЕХОД -->

      <div class="setting-section">

        <div class="switch-row">

          <div>

            <div class="setting-title">
              Автопереход
            </div>

            <div class="switch-description">
              После получения очка сразу открывать следующую букву
            </div>

          </div>


          <label class="switch">

            <input
              id="autoNextToggle"
              type="checkbox"
              onchange="changeAutoNext()"
            >

            <span class="slider"></span>

          </label>

        </div>

      </div>


    </div>

  </div>


  <!-- =======================================================
       ФИНАЛ
  ======================================================== -->

  <section
    id="winnerScreen"
    class="winner-screen hidden"
  >

    <div id="victoryEffects"></div>


    <div class="winner-card">

      <h2>
        Партия окончена!
      </h2>

      <div id="winnerText"></div>

      <div id="finalScore"></div>

      <button
        class="primary-button"
        onclick="playAgain()"
      >
        Сыграть ещё раз
      </button>

    </div>

  </section>



  <script>


    /* =========================================================
       ВОПРОСЫ
    ========================================================= */

    const questions = [

      "Может быть красного цвета",
      "Город",
      "Еда",
      "Одежда",
      "Тоньше сантиметра",
      "Вещь, которая есть у вашей семьи",
      "Вещь, которая может служить для преступления",
      "Можно увидеть в больнице",
      "Можно увидеть в деревне",
      "Аббревиатура",
      "Вещь, которую можно сделать из металла",
      "Мужское имя",
      "Связано с войной",
      "Можно увидеть в школе или институте",
      "Слово, в котором есть «ь»",
      "Наречие",
      "На что вы можете посмотреть прямо сейчас",
      "Профессия",
      "Можно положить в карман",
      "Связано со спортом",
      "Вещь, которую запрещено проносить в самолёт",
      "Можно коллекционировать",
      "Произведение: фильм, книга или песня",
      "Бренд",
      "Техническое устройство",
      "Знаменитая личность",
      "Страна"

    ];


    /* =========================================================
       БУКВЫ
       Ъ, Ы и Ь не используем
    ========================================================= */

    const allLetters = [

      "А", "Б", "В", "Г", "Д",
      "Е", "Ё", "Ж", "З", "И",
      "Й", "К", "Л", "М", "Н",
      "О", "П", "Р", "С", "Т",
      "У", "Ф", "Х", "Ц", "Ч",
      "Ш", "Щ", "Э", "Ю", "Я"

    ];


    /* =========================================================
       ЦВЕТА ИГРОКОВ
    ========================================================= */

    const playerColors = [

      {
        id: "red",
        name: "Красный",
        background: "#e85b5b",
        text: "#ffffff"
      },

      {
        id: "orange",
        name: "Оранжевый",
        background: "#ef9950",
        text: "#1d1d1d"
      },

      {
        id: "yellow",
        name: "Жёлтый",
        background: "#f3d75c",
        text: "#1d1d1d"
      },

      {
        id: "green",
        name: "Зелёный",
        background: "#6cc488",
        text: "#162319"
      },

      {
        id: "cyan",
        name: "Голубой",
        background: "#79c9dd",
        text: "#142428"
      },

      {
        id: "blue",
        name: "Синий",
        background: "#587bd8",
        text: "#ffffff"
      },

      {
        id: "violet",
        name: "Фиолетовый",
        background: "#9170d7",
        text: "#ffffff"
      },

      {
        id: "pink",
        name: "Розовый",
        background: "#ef8fbb",
        text: "#24151c"
      },

      {
        id: "white",
        name: "Белый",
        background: "#ffffff",
        text: "#1d1d1d"
      },

      {
        id: "black",
        name: "Чёрный",
        background: "#191919",
        text: "#ffffff"
      }

    ];


    /* =========================================================
       ПЕРЕМЕННЫЕ
    ========================================================= */

    let player1Name = "Игрок 1";
    let player2Name = "Игрок 2";

    let player1Color = "red";
    let player2Color = "blue";

    let score1 = 0;
    let score2 = 0;

    let theme = "light";
    let autoNext = true;

    let totalRounds = 10;

    let letterQueue = [];
    let completedLetters = [];

    let currentLetter = null;
    let currentQuestion = null;

    let completedCount = 0;

    let timeLeft = 30;
    let timerInterval = null;

    let roundActive = false;
    let pointWasGiven = false;

    let lastQuestionForLetter = {};


    /* =========================================================
       ЗАГРУЗКА НАСТРОЕК
    ========================================================= */

    function loadSettings() {

      player1Name =
        localStorage.getItem("player1Name")
        || "Игрок 1";

      player2Name =
        localStorage.getItem("player2Name")
        || "Игрок 2";

      player1Color =
        localStorage.getItem("player1Color")
        || "red";

      player2Color =
        localStorage.getItem("player2Color")
        || "blue";

      theme =
        localStorage.getItem("gameTheme")
        || "light";


      const savedAutoNext =
        localStorage.getItem("autoNext");


      if (savedAutoNext !== null) {

        autoNext =
          savedAutoNext === "true";

      }


      document.getElementById("startName1").value =
        player1Name;

      document.getElementById("startName2").value =
        player2Name;

      document.getElementById("settingsName1").value =
        player1Name;

      document.getElementById("settingsName2").value =
        player2Name;

      document.getElementById("autoNextToggle").checked =
        autoNext;


      applyTheme();

      renderColorOptions();

    }


    function saveSettings() {

      localStorage.setItem(
        "player1Name",
        player1Name
      );

      localStorage.setItem(
        "player2Name",
        player2Name
      );

      localStorage.setItem(
        "player1Color",
        player1Color
      );

      localStorage.setItem(
        "player2Color",
        player2Color
      );

      localStorage.setItem(
        "gameTheme",
        theme
      );

      localStorage.setItem(
        "autoNext",
        autoNext
      );

    }


    /* =========================================================
       СТАРТ ИГРЫ
    ========================================================= */

    function startGame() {

      player1Name =
        document
          .getElementById("startName1")
          .value
          .trim()
        || "Игрок 1";


      player2Name =
        document
          .getElementById("startName2")
          .value
          .trim()
        || "Игрок 2";


      totalRounds =
        Number(
          document
            .getElementById("roundCount")
            .value
        );


      document.getElementById("settingsName1").value =
        player1Name;

      document.getElementById("settingsName2").value =
        player2Name;


      saveSettings();


      document
        .getElementById("startScreen")
        .classList
        .add("hidden");


      document
        .getElementById("gameScreen")
        .classList
        .remove("hidden");


      newGame();

    }


    /* =========================================================
       НОВАЯ ПАРТИЯ
    ========================================================= */

    function newGame() {

      clearInterval(timerInterval);


      score1 = 0;
      score2 = 0;

      completedCount = 0;

      completedLetters = [];

      lastQuestionForLetter = {};


      document.getElementById("score1").textContent =
        "0";

      document.getElementById("score2").textContent =
        "0";


      document
        .getElementById("winnerScreen")
        .classList
        .add("hidden");


      clearVictoryEffects();


      const shuffledLetters =
        shuffleArray([...allLetters]);


      letterQueue =
        shuffledLetters.slice(
          0,
          totalRounds
        );


      updatePlayerCards();

      startNextLetter();

    }


    /* =========================================================
       НОВЫЙ РАУНД
    ========================================================= */

    function startNextLetter() {

      clearInterval(timerInterval);


      pointWasGiven = false;


      document
        .getElementById("nextButton")
        .classList
        .add("hidden");


      document
        .getElementById("skipButton")
        .classList
        .remove("hidden");


      document.getElementById("statusMessage").textContent =
        "";


      if (completedCount >= totalRounds) {

        finishGame();

        return;

      }


      currentLetter =
        letterQueue.shift();


      currentQuestion =
        getQuestionForLetter(
          currentLetter
        );


      document.getElementById("letter").textContent =
        currentLetter;


      document.getElementById("question").textContent =
        currentQuestion;


      timeLeft = 30;

      roundActive = true;


      enablePlayerCards();

      updateTimer();

      renderProgress();


      timerInterval =
        setInterval(
          function () {

            timeLeft--;

            updateTimer();


            if (timeLeft <= 0) {

              clearInterval(
                timerInterval
              );


              roundActive = false;

              disablePlayerCards();


              document.getElementById(
                "statusMessage"
              ).textContent =
                "Время вышло — можно отложить букву";

            }

          },
          1000
        );

    }


    /* =========================================================
       ОЧКО
    ========================================================= */

    function givePoint(player) {

      if (
        !roundActive
        || pointWasGiven
      ) {

        return;

      }


      pointWasGiven = true;

      roundActive = false;


      clearInterval(
        timerInterval
      );


      disablePlayerCards();


      if (player === 1) {

        score1++;


        document.getElementById("score1").textContent =
          score1;


        showPlusAnimation(1);


        /*
          ПРАЗДНИК ТОЛЬКО
          НА 5, 10, 15... ОЧКАХ
        */

        if (
          score1 % 5 === 0
        ) {

          showMiniCelebration(1);

        }


        document.getElementById(
          "statusMessage"
        ).textContent =
          "Очко: " + player1Name;

      }


      if (player === 2) {

        score2++;


        document.getElementById("score2").textContent =
          score2;


        showPlusAnimation(2);


        if (
          score2 % 5 === 0
        ) {

          showMiniCelebration(2);

        }


        document.getElementById(
          "statusMessage"
        ).textContent =
          "Очко: " + player2Name;

      }


      completedLetters.push(
        currentLetter
      );


      completedCount++;


      renderProgress();


      document
        .getElementById("skipButton")
        .classList
        .add("hidden");


      if (
        completedCount >= totalRounds
      ) {

        setTimeout(
          finishGame,
          600
        );

        return;

      }


      if (autoNext) {

        setTimeout(
          startNextLetter,
          500
        );

      } else {

        document
          .getElementById("nextButton")
          .classList
          .remove("hidden");

      }

    }


    /* =========================================================
       МИНИ-ПРАЗДНИК НА КАЖДОМ 5-м ОЧКЕ
    ========================================================= */

    function showMiniCelebration(player) {

      const container =
        document.getElementById(
          "miniCelebration" + player
        );


      container.innerHTML = "";


      const effectSets = [

        [
          "✨",
          "⭐",
          "💫"
        ],

        [
          "❤️",
          "💗",
          "💕"
        ],

        [
          "🎉",
          "🎊",
          "✨"
        ],

        [
          "🔥",
          "⚡",
          "💥"
        ],

        [
          "🏆",
          "👑",
          "⭐"
        ]

      ];


      const chosenSet =
        randomItem(effectSets);


      for (
        let i = 0;
        i < 11;
        i++
      ) {

        const particle =
          document.createElement("div");


        particle.className =
          "mini-particle";


        particle.textContent =
          randomItem(chosenSet);


        const angle =
          Math.random()
          * Math.PI
          * 2;


        const distance =
          60
          + Math.random()
          * 90;


        const x =
          Math.cos(angle)
          * distance;


        const y =
          Math.sin(angle)
          * distance;


        const rotation =
          -80
          + Math.random()
          * 160;


        particle.style.setProperty(
          "--x",
          x + "px"
        );


        particle.style.setProperty(
          "--y",
          y + "px"
        );


        particle.style.setProperty(
          "--r",
          rotation + "deg"
        );


        particle.style.animationDelay =
          Math.random()
          * 0.15
          + "s";


        container.appendChild(
          particle
        );

      }


      setTimeout(
        function () {

          container.innerHTML = "";

        },
        1500
      );

    }


    /* =========================================================
       СЛЕДУЮЩИЙ РАУНД ВРУЧНУЮ
    ========================================================= */

    function nextRoundAfterPoint() {

      document
        .getElementById("nextButton")
        .classList
        .add("hidden");


      startNextLetter();

    }


    /* =========================================================
       НЕ ЗНАЕМ
    ========================================================= */

    function skipLetter() {

      if (
        !currentLetter
        || pointWasGiven
      ) {

        return;

      }


      clearInterval(
        timerInterval
      );


      roundActive = false;


      disablePlayerCards();


      /*
        Буква уходит в конец очереди.
      */

      letterQueue.push(
        currentLetter
      );


      document.getElementById(
        "statusMessage"
      ).textContent =
        "Буква "
        + currentLetter
        + " вернётся позже";


      renderProgress();


      setTimeout(
        startNextLetter,
        500
      );

    }


    /* =========================================================
       СЛУЧАЙНЫЙ ВОПРОС
    ========================================================= */

    function getQuestionForLetter(letter) {

      let possibleQuestions =
        questions.filter(
          function (question) {

            return (
              question
              !==
              lastQuestionForLetter[
                letter
              ]
            );

          }
        );


      if (
        possibleQuestions.length === 0
      ) {

        possibleQuestions =
          [...questions];

      }


      const question =
        randomItem(
          possibleQuestions
        );


      lastQuestionForLetter[
        letter
      ] =
        question;


      return question;

    }


    /* =========================================================
       ПРОГРЕСС
    ========================================================= */

    function renderProgress() {

      const container =
        document.getElementById(
          "lettersProgress"
        );


      container.innerHTML = "";


      completedLetters.forEach(
        function (letter) {

          container.appendChild(
            createLetterChip(
              letter,
              "done"
            )
          );

        }
      );


      if (
        currentLetter
        &&
        completedCount < totalRounds
        &&
        !pointWasGiven
      ) {

        container.appendChild(
          createLetterChip(
            currentLetter,
            "current"
          )
        );

      }


      letterQueue.forEach(
        function (letter) {

          container.appendChild(
            createLetterChip(
              letter,
              ""
            )
          );

        }
      );


      const visibleRound =
        Math.min(
          completedCount + 1,
          totalRounds
        );


      document.getElementById(
        "roundText"
      ).textContent =
        "Буква "
        + visibleRound
        + " из "
        + totalRounds;

    }


    function createLetterChip(
      letter,
      state
    ) {

      const chip =
        document.createElement("div");


      chip.className =
        "letter-chip "
        + state;


      chip.textContent =
        letter;


      return chip;

    }


    /* =========================================================
       ТАЙМЕР
    ========================================================= */

    function updateTimer() {

      const seconds =
        String(
          timeLeft
        ).padStart(
          2,
          "0"
        );


      document.getElementById(
        "timer"
      ).textContent =
        "00:" + seconds;

    }


    /* =========================================================
       КАРТОЧКИ ИГРОКОВ
    ========================================================= */

    function updatePlayerCards() {

      document.getElementById(
        "playerName1"
      ).textContent =
        player1Name;


      document.getElementById(
        "playerName2"
      ).textContent =
        player2Name;


      applyPlayerColor(
        1,
        player1Color
      );


      applyPlayerColor(
        2,
        player2Color
      );

    }


    function applyPlayerColor(
      player,
      colorId
    ) {

      const color =
        playerColors.find(
          function (item) {

            return (
              item.id
              ===
              colorId
            );

          }
        );


      if (!color) {

        return;

      }


      const card =
        document.getElementById(
          "playerCard"
          + player
        );


      card.style.background =
        color.background;


      card.style.color =
        color.text;


      if (
        colorId === "white"
      ) {

        card.style.border =
          "2px solid #d8d8d8";

      } else {

        card.style.border =
          "none";

      }

    }


    function enablePlayerCards() {

      document.getElementById(
        "playerCard1"
      ).disabled = false;


      document.getElementById(
        "playerCard2"
      ).disabled = false;

    }


    function disablePlayerCards() {

      document.getElementById(
        "playerCard1"
      ).disabled = true;


      document.getElementById(
        "playerCard2"
      ).disabled = true;

    }


    function showPlusAnimation(
      player
    ) {

      const element =
        document.getElementById(
          "plus" + player
        );


      element.classList.remove(
        "show"
      );


      void element.offsetWidth;


      element.classList.add(
        "show"
      );

    }


    /* =========================================================
       НАСТРОЙКИ
    ========================================================= */

    function openSettings() {

      document.getElementById(
        "settingsName1"
      ).value =
        player1Name;


      document.getElementById(
        "settingsName2"
      ).value =
        player2Name;


      document.getElementById(
        "autoNextToggle"
      ).checked =
        autoNext;


      updateThemeButtons();

      renderColorOptions();


      document
        .getElementById(
          "settingsBackdrop"
        )
        .classList
        .remove("hidden");

    }


    function closeSettings() {

      document
        .getElementById(
          "settingsBackdrop"
        )
        .classList
        .add("hidden");

    }


    function backdropClick(event) {

      if (
        event.target.id
        ===
        "settingsBackdrop"
      ) {

        closeSettings();

      }

    }


    function updateNamesFromSettings() {

      player1Name =
        document
          .getElementById(
            "settingsName1"
          )
          .value
          .trim()
        || "Игрок 1";


      player2Name =
        document
          .getElementById(
            "settingsName2"
          )
          .value
          .trim()
        || "Игрок 2";


      updatePlayerCards();

      saveSettings();

    }


    /* =========================================================
       ТЕМА
    ========================================================= */

    function setTheme(
      newTheme
    ) {

      theme =
        newTheme;


      applyTheme();

      saveSettings();

    }


    function applyTheme() {

      if (
        theme === "dark"
      ) {

        document.body.classList.add(
          "dark"
        );

      } else {

        document.body.classList.remove(
          "dark"
        );

      }


      updateThemeButtons();

    }


    function updateThemeButtons() {

      const light =
        document.getElementById(
          "lightThemeButton"
        );


      const dark =
        document.getElementById(
          "darkThemeButton"
        );


      light.classList.toggle(
        "selected",
        theme === "light"
      );


      dark.classList.toggle(
        "selected",
        theme === "dark"
      );

    }


    /* =========================================================
       ЦВЕТА ИГРОКОВ В НАСТРОЙКАХ
    ========================================================= */

    function renderColorOptions() {

      renderColorsForPlayer(
        1,
        "colorsPlayer1",
        player1Color
      );


      renderColorsForPlayer(
        2,
        "colorsPlayer2",
        player2Color
      );

    }


    function renderColorsForPlayer(
      player,
      containerId,
      selectedColor
    ) {

      const container =
        document.getElementById(
          containerId
        );


      container.innerHTML = "";


      playerColors.forEach(
        function (color) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "color-option";


          if (
            color.id
            ===
            selectedColor
          ) {

            button.classList.add(
              "selected"
            );

          }


          button.style.background =
            color.background;


          button.style.color =
            color.text;


          button.title =
            color.name;


          button.onclick =
            function () {

              selectPlayerColor(
                player,
                color.id
              );

            };


          container.appendChild(
            button
          );

        }
      );

    }


    function selectPlayerColor(
      player,
      colorId
    ) {

      if (
        player === 1
      ) {

        player1Color =
          colorId;

      } else {

        player2Color =
          colorId;

      }


      applyPlayerColor(
        player,
        colorId
      );


      renderColorOptions();

      saveSettings();

    }


    /* =========================================================
       АВТОПЕРЕХОД
    ========================================================= */

    function changeAutoNext() {

      autoNext =
        document
          .getElementById(
            "autoNextToggle"
          )
          .checked;


      saveSettings();

    }


    /* =========================================================
       ФИНАЛ
    ========================================================= */

    function finishGame() {

      clearInterval(
        timerInterval
      );


      roundActive = false;


      disablePlayerCards();


      const winnerText =
        document.getElementById(
          "winnerText"
        );


      if (
        score1 > score2
      ) {

        winnerText.textContent =
          "Победил "
          + player1Name
          + "! 🎉";

      } else if (
        score2 > score1
      ) {

        winnerText.textContent =
          "Победил "
          + player2Name
          + "! 🎉";

      } else {

        winnerText.textContent =
          "Ничья! 🎉";

      }


      document.getElementById(
        "finalScore"
      ).textContent =
        score1
        + " : "
        + score2;


      document
        .getElementById(
          "winnerScreen"
        )
        .classList
        .remove("hidden");


      /*
        КАЖДЫЙ РАЗ ВЫБИРАЕМ
        СЛУЧАЙНУЮ БОЛЬШУЮ АНИМАЦИЮ
      */

      startRandomVictoryEffect();

    }


    function playAgain() {

      clearVictoryEffects();


      document
        .getElementById(
          "winnerScreen"
        )
        .classList
        .add("hidden");


      /*
        Возвращаемся к стартовому экрану,
        чтобы можно было снова выбрать
        число букв.
      */

      document
        .getElementById(
          "gameScreen"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "startScreen"
        )
        .classList
        .remove("hidden");

    }


    function restartGame() {

      const confirmed =
        confirm(
          "Начать новую партию? Текущий счёт сбросится."
        );


      if (!confirmed) {

        return;

      }


      clearInterval(
        timerInterval
      );


      document
        .getElementById(
          "gameScreen"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "startScreen"
        )
        .classList
        .remove("hidden");

    }


    /* =========================================================
       СЛУЧАЙНЫЕ ПОБЕДНЫЕ АНИМАЦИИ
    ========================================================= */

    function startRandomVictoryEffect() {

      clearVictoryEffects();


      const effects = [

        victoryCats,
        victoryHearts,
        victoryBalloons,
        victoryPlanes,
        victoryFireworks,
        victoryConfetti

      ];


      const effect =
        randomItem(
          effects
        );


      effect();

    }


    function clearVictoryEffects() {

      const container =
        document.getElementById(
          "victoryEffects"
        );


      container.innerHTML = "";

    }


    /* ---------- КОТИКИ ---------- */

    function victoryCats() {

        );

        "😻",
        "😹",
        "🐈"
      ];

        let i = 0;

        i++
      ) {

        const cat =
          document.createElement(
            "div"
          );

          "falling-effect";


        cat.textContent =
          randomItem(cats);


        cat.style.left =

          + "%";


        cat.style.fontSize =

          + Math.random()
          * 35

          + Math.random()
          * 3

          + Math.random()

          3
          + Math.random()
          * 3

    /* ---------- ШАРИКИ ---------- */

    function victoryBalloons() {

      const container =
        document.getElementById(
          "victoryEffects"
        );


      const balloons = [
        "🎈",
        "🎈",
        "🎈",
        "🎈"
      ];


      for (
        let i = 0;
        i < 28;
        i++
      ) {

        const balloon =
          document.createElement(
            "div"
          );


        balloon.className =
          "balloon-effect";


        balloon.textContent =
          randomItem(
            balloons
          );


        balloon.style.left =
          Math.random()
          * 100
          + "%";


        balloon.style.fontSize =
          35
          + Math.random()
          * 38
          + "px";


        balloon.style.setProperty(
          "--drift",
          (
            -100
            + Math.random()
            * 200
          )

        );


        balloon.style.animationDuration =

          + Math.random()

    /* ---------- САМОЛЁТЫ ---------- */

    function victoryPlanes() {

      const container =
        document.getElementById(
          "victoryEffects"
        );


      const messages = [

        "✈️ УРА!",
        "✈️ ПОБЕДА!",
        "✈️ МОЛОДЕЦ!",
        "✈️ ЧЕМПИОН!"

      ];


      for (
        let i = 0;
        i < 6;
        i++
      ) {

        const plane =
          document.createElement(
            "div"
          );


        plane.className =
          "plane-effect";


        plane.textContent =
          messages[
            i
            %
            messages.length
          ];


        plane.style.top =
          (
            8
            + i
            * 14
          )
          + "%";


        plane.style.animationDuration =
          (
            4
            + Math.random()
            * 2
          )
          + "s";


        plane.style.animationDelay =
          (
            i
            * 0.55
          )
          + "s";


        container.appendChild(
          plane
        );

      }

    }


    /* ---------- ФЕЙЕРВЕРК ---------- */

    function victoryFireworks() {

      const container =
        document.getElementById(
          "victoryEffects"
        );


      const colors = [

        "#ff4d6d",
        "#ffd43b",
        "#51cf66",
        "#339af0",
        "#845ef7",
        "#ff922b",
        "#f06595"

      ];


      for (
        let burst = 0;
        burst < 11;
        burst++
      ) {

        setTimeout(
          function () {

            createFirework(
              container,
              colors
            );

          },
          burst
          * 350
        );

      }

    }


    function createFirework(
      container,
      colors
    ) {

      const firework =
        document.createElement(
          "div"
        );


      firework.className =
        "firework";


      firework.style.left =
        (
          10
          + Math.random()
          * 80
        )
        + "%";


      firework.style.top =
        (
          10
          + Math.random()
          * 65
        )
        + "%";


      const chosenColor =
        randomItem(
          colors
        );


      for (
        let i = 0;
        i < 24;
        i++
      ) {

        const piece =
          document.createElement(
            "div"
          );


        piece.className =
          "firework-piece";


        piece.style.background =
          chosenColor;


        const angle =
          (
            Math.PI
            * 2
            * i
          )
          / 24;


        const distance =
          75
          + Math.random()
          * 95;


        piece.style.setProperty(
          "--x",
          Math.cos(angle)
          * distance
          + "px"
        );


        piece.style.setProperty(
          "--y",
          Math.sin(angle)
          * distance
          + "px"
        );


        firework.appendChild(
          piece
        );

      }


      container.appendChild(
        firework
      );


      setTimeout(
        function () {

          firework.remove();

        },
        1600
      );

    }


    /* ---------- КОНФЕТТИ ---------- */

        piece.style.animationDuration =

          + Math.random()

        );

      }

    }


    /* =========================================================
       ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    ========================================================= */

    function randomItem(array) {

      return array[
        Math.floor(
          Math.random()
          * array.length
        )
      ];

    }


    function shuffleArray(array) {

      for (
        let i =
          array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random()
            * (i + 1)
          );


        [
          array[i],
          array[j]
        ]
        =
        [
          array[j],
          array[i]
        ];

      }


      return array;

    }


    /* =========================================================
       ЗАПУСК
    ========================================================= */

    loadSettings();


  </script>
