<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Игра на букву</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: min(900px, 92%);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border: 3px solid #222;
      border-radius: 20px;
      padding: 25px;
      min-height: 230px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .label {
      font-size: 18px;
      opacity: 0.6;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #question {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.25;
    }

    #letter {
      font-size: 110px;
      font-weight: bold;
    }

    .timer {
      font-size: 56px;
      font-weight: bold;
      margin: 20px 0;
    }

    .players {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
    }

    .player {
      background: white;
      border-radius: 16px;
      padding: 20px;
    }

    .score {
      font-size: 38px;
      font-weight: bold;
      margin: 10px 0 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 18px;
      cursor: pointer;
    }

    .score-button {
      width: 100%;
    }

    .next-button {
      margin-top: 25px;
      font-size: 20px;
      padding: 16px 32px;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    .time-over {
      margin-top: 10px;
      font-size: 24px;
      font-weight: bold;
      min-height: 30px;
    }

    @media (max-width: 700px) {
      .cards,
      .players {
        grid-template-columns: 1fr;
      }

      #question {
        font-size: 28px;
      }

      #letter {
        font-size: 90px;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <h1>Кто быстрее?</h1>

    <section class="cards">

      <div class="card">
        <div class="label">Вопрос</div>
        <div id="question">Нажмите «Следующий раунд»</div>
      </div>

      <div class="card">
        <div class="label">Буква</div>
        <div id="letter">?</div>
      </div>

    </section>

    <div class="timer" id="timer">00:30</div>

    <div class="time-over" id="message"></div>

    <section class="players">

      <div class="player">
        <div>Игрок 1</div>
        <div class="score" id="score1">0</div>

        <button class="score-button" onclick="givePoint(1)">
          +1 Игроку 1
        </button>
      </div>

      <div class="player">
        <div>Игрок 2</div>
        <div class="score" id="score2">0</div>

        <button class="score-button" onclick="givePoint(2)">
          +1 Игроку 2
        </button>
      </div>

    </section>

    <button class="next-button" onclick="nextRound()">
      Следующий раунд
    </button>

  </main>


  <script>

    const questions = [
      "Может быть красного цвета",
      "Город",
      "Еда",
      "Одежда",
      "Тоньше сантиметра",
      "Вещь, которая есть у вашей семьи",
      "Вещь, которая может служить для преступления",
      "Можно увидеть в больнице",
      "Можно увидеть в деревне",
      "Аббревиатура",
      "Вещь, которую можно сделать из металла",
      "Мужское имя",
      "Связано с войной",
      "Можно увидеть в школе или институте",
      "Слово, в котором есть «ь»",
      "Наречие",
      "На что вы можете посмотреть прямо сейчас",
      "Профессия",
      "Можно положить в карман",
      "Связано со спортом",
      "Вещь, которую запрещено проносить в самолёт",
      "Можно коллекционировать",
      "Произведение: фильм, книга или песня",
      "Бренд",
      "Техническое устройство",
      "Знаменитая личность",
      "Страна"
    ];


    const letters = [
      "А", "Б", "В", "Г", "Д",
      "Е", "Ё", "Ж", "З", "И",
      "Й", "К", "Л", "М", "Н",
      "О", "П", "Р", "С", "Т",
      "У", "Ф", "Х", "Ц", "Ч",
      "Ш", "Щ", "Э", "Ю", "Я"
    ];


    let score1 = 0;
    let score2 = 0;

    let timeLeft = 30;
    let timerInterval = null;

    let roundActive = false;


    function randomItem(array) {
      const index = Math.floor(Math.random() * array.length);
      return array[index];
    }


    function nextRound() {

      clearInterval(timerInterval);

      const question = randomItem(questions);
      const letter = randomItem(letters);

      document.getElementById("question").textContent = question;
      document.getElementById("letter").textContent = letter;

      document.getElementById("message").textContent = "";

      timeLeft = 30;
      roundActive = true;

      updateTimer();

      timerInterval = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

          clearInterval(timerInterval);

          roundActive = false;

          document.getElementById("message").textContent =
            "Время вышло!";

        }

      }, 1000);

    }


    function updateTimer() {

      const seconds = String(timeLeft).padStart(2, "0");

      document.getElementById("timer").textContent =
        "00:" + seconds;

    }


    function givePoint(player) {

      if (!roundActive) {
        return;
      }

      roundActive = false;

      clearInterval(timerInterval);

      if (player === 1) {

        score1++;

        document.getElementById("score1").textContent = score1;

        document.getElementById("message").textContent =
          "Очко получает Игрок 1!";

      }

      if (player === 2) {

        score2++;

        document.getElementById("score2").textContent = score2;

        document.getElementById("message").textContent =
          "Очко получает Игрок 2!";

      }

    }

  </script>

</body>
</html>
